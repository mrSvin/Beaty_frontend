server {
    listen 80;
    listen [::]:80;
    server_name simbeauty.ru www.simbeauty.ru;
    return 301 https://simbeauty.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.simbeauty.ru;
    ssl_certificate /etc/letsencrypt/live/simbeauty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simbeauty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # IMPORTANT: certificate must include www.simbeauty.ru in SAN.
    return 301 https://simbeauty.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simbeauty.ru;
    root /var/www/simbeauty;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/simbeauty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simbeauty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canonical URLs without trailing slash, except site root.
    location ~ ^(.+)/$ { return 301 https://simbeauty.ru$1$is_args$args; }
    location = / { try_files /index.html =404; }
    location = /404 { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri/index.html $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
